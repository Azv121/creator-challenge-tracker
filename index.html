<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Creator Challenge Tracker</title>
    <style>
        /* Modern, native CSS styling to replace Tailwind warnings */
        :root {
            --bg-color: #18181b;
            --card-bg: #27272a;
            --accent-gradient: linear-gradient(to right, #ef4444, #fb923c);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }
        header { text-align: center; margin: 24px 0; }
        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin: 0;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
        }
        p.subtitle { color: var(--text-muted); margin-top: 8px; font-size: 0.875rem; }
        main { width: 100%; max-w: 768px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .player-container {
            width: 100%;
			max-width: 720px;   /* smaller player */
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid #3f3f46;
        }
        iframe { width: 100%; height: 100%; border: 0; }
        .progress-wrapper { width: 100%; max-w: 448px; display: flex; flex-direction: column; gap: 4px; }
        .progress-bg { width: 100%; background: var(--card-bg); height: 8px; border-radius: 9999px; overflow: hidden; border: 1px solid #3f3f46; }
        .progress-bar { background: var(--accent-gradient); height: 100%; width: 0%; transition: width 0.3s ease-out; }
        .progress-text { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); font-family: monospace; margin-top: 4px; }
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-w: 448px;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #3f3f46;
            box-sizing: border-box;
        }
        button {
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            border: 0;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            color: #fff;
        }
        button:active { transform: scale(0.95); }
        #prev-btn { background: #52525b; }
        #prev-btn:hover { background: #71717a; }
        #next-btn { background: #dc2626; }
        #next-btn:hover { background: #ef4444; }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .counter-text { font-family: monospace; font-size: 1.125rem; font-weight: 700; color: #d4d4d8; }
        .lookup-wrapper { width: 100%; max-w: 448px; display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .input-group { display: flex; gap: 8px; }
        input {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid #3f3f46;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.875rem;
            color: #e4e4e7;
            outline: none;
        }
        input:focus { border-color: #dc2626; }
        #lookup-btn { background: #52525b; padding: 8px 16px; }
        #lookup-btn:hover { background: #71717a; }
        .error-text { font-size: 0.75rem; color: #f87171; display: none; margin: 0; }
        footer { text-align: center; font-size: 0.75rem; color: #52525b; margin: 24px 0; }
    </style>
</head>
<body>

    <header>
        <h1>CREATOR CHALLENGE</h1>
        <p class="subtitle">Watch every video in sequence</p>
    </header>

    <main>
        <div class="player-container">
			<iframe
				id="youtube-player"
				src=""
				allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
				allowfullscreen>
			</iframe>
        </div>

        <div class="progress-wrapper">
            <div class="progress-bg">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div class="progress-text">
                <span id="time-indicator">0h 00m 00s / 0h 00m 00s</span>
                <span id="percent-indicator">0% watched</span>
            </div>
        </div>

        <div class="controls-row">
            <button id="prev-btn">← Previous</button>
            <span id="counter" class="counter-text">0 / 0</span>
            <button id="next-btn">Next →</button>
        </div>

        <div class="lookup-wrapper">
            <label for="url-lookup">Jump to Video via URL:</label>
            <div class="input-group">
                <input type="text" id="url-lookup" placeholder="Paste YouTube video URL here..." />
                <button id="lookup-btn">Go</button>
            </div>
            <p id="error-msg" class="error-text"></p>
        </div>
    </main>

    <footer>
        Powered by open-source tech.
    </footer>

        let currentIndex = 0;
        let totalPlaylistDuration = 0;

        document.addEventListener("DOMContentLoaded", () => {
            const player = document.getElementById('youtube-player');
            const counter = document.getElementById('counter');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const urlInput = document.getElementById('url-lookup');
            const lookupBtn = document.getElementById('lookup-btn');
            const errorMsg = document.getElementById('error-msg');
            const progressBar = document.getElementById('progress-bar');
            const timeIndicator = document.getElementById('time-indicator');
            const percentIndicator = document.getElementById('percent-indicator');

            function parseToSeconds(timeStr) {
                let totalSecs = 0;
                const hoursMatch = timeStr.match(/(\d+)\s*h/i);
                const minsMatch = timeStr.match(/(\d+)\s*m/i);
                const secsMatch = timeStr.match(/(\d+)\s*s/i);
                if (hoursMatch) totalSecs += parseInt(hoursMatch) * 3600;
                if (minsMatch)  totalSecs += parseInt(minsMatch) * 60;
                if (secsMatch)  totalSecs += parseInt(secsMatch);
                return totalSecs;
            }

            function formatTime(totalSeconds) {
                const hrs = Math.floor(totalSeconds / 3600);
                const mins = Math.floor((totalSeconds % 3600) / 60);
                const secs = totalSeconds % 60;
                const displayMins = mins < 10 ? "0" + mins : mins;
                const displaySecs = secs < 10 ? "0" + secs : secs;
                return `${hrs}h ${displayMins}m ${displaySecs}s`;
            }

            function calculateTotalDuration() {
                totalPlaylistDuration = playlistData.reduce((sum, item) => sum + parseToSeconds(item.duration), 0);
            }

            function getWatchTimeProgress() {
                let currentProgressSeconds = 0;
                for (let i = 0; i <= currentIndex; i++) {
                    currentProgressSeconds += parseToSeconds(playlistData[i].duration);
                }
                return currentProgressSeconds;
            }

			function updateUI() {
				if (playlistData.length === 0) return;

				const currentVideo = playlistData[currentIndex];

				// Correct YouTube embed URL
				player.src = `https://www.youtube.com/embed/${currentVideo.id}?rel=0`;

				counter.innerText = `${currentIndex + 1} / ${playlistData.length}`;

				const accumulatedWatchTime = getWatchTimeProgress();

				const progressPercent =
					totalPlaylistDuration > 0
						? Math.round((accumulatedWatchTime / totalPlaylistDuration) * 100)
						: 0;

				progressBar.style.width = `${progressPercent}%`;

				percentIndicator.innerText = `${progressPercent}% watched`;

				timeIndicator.innerText =
					`${formatTime(accumulatedWatchTime)} / ${formatTime(totalPlaylistDuration)}`;

				prevBtn.disabled = currentIndex === 0;
				nextBtn.disabled = currentIndex === playlistData.length - 1;
			}

			function extractVideoId(url) {
				const regExp =
					/^.*(?:youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]{11}).*/;

				const match = url.match(regExp);

				return match ? match[1] : null;
			}

            prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; updateUI(); } });
            nextBtn.addEventListener('click', () => { if (currentIndex < playlistData.length - 1) { currentIndex++; updateUI(); } });

            function handleLookup() {
                errorMsg.style.display = 'none';
                const urlValue = urlInput.value.trim();
                if (!urlValue) return;

                const extractedId = extractVideoId(urlValue);
                if (!extractedId) {
                    errorMsg.innerText = "Invalid YouTube URL format.";
                    errorMsg.style.display = 'block';
                    return;
                }

                const foundIndex = playlistData.findIndex(item => item.id === extractedId);
                if (foundIndex !== -1) {
                    currentIndex = foundIndex;
                    updateUI();
                    urlInput.value = "";
                } else {
                    errorMsg.innerText = "This video is not part of this specific playlist challenge.";
                    errorMsg.style.display = 'block';
                }
            }

            lookupBtn.addEventListener('click', handleLookup);
            urlInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLookup(); });

            if (playlistData.length > 0) {
                calculateTotalDuration();
                updateUI();
            }
        });
    </script>
