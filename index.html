<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Creator Challenge Tracker</title>
    <!-- Tailwind CSS for modern, clean layout -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen flex flex-col items-center justify-between p-4 font-sans">

    <!-- Header Section -->
    <header class="text-center my-6">
        <h1 id="main-title" class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-red-500 to-orange-400 bg-clip-text text-transparent">
            CREATOR CHALLENGE
        </h1>
        <p class="text-zinc-400 mt-2 text-sm">Watch every video in sequence</p>
    </header>

    <!-- Main Content Area -->
    <main class="w-full max-w-3xl flex flex-col items-center gap-4">
        
        <!-- Interactive YouTube Player Container -->
        <div class="w-full aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border border-zinc-800">
            <iframe 
                id="youtube-player"
                class="w-full h-full"
                src="" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>

        <!-- Visual Progress Bar and Text Indicators -->
        <div class="w-full max-w-md flex flex-col gap-1 mt-2">
            <div class="w-full bg-zinc-800 h-2 rounded-full overflow-hidden border border-zinc-700">
                <div id="progress-bar" class="bg-gradient-to-r from-red-500 to-orange-400 h-full w-0 transition-all duration-300 ease-out"></div>
            </div>
            <div class="flex justify-between text-xs text-zinc-400 font-mono mt-1">
                <span id="time-indicator">0h 00m 00s / 0h 00m 00s</span>
                <span id="percent-indicator">0% watched</span>
            </div>
        </div>

        <!-- Navigation & Counter Controls -->
        <div class="flex items-center justify-between w-full max-w-md bg-zinc-800 p-2 rounded-lg border border-zinc-700">
            <button id="prev-btn" class="px-5 py-2 bg-zinc-700 hover:bg-zinc-600 active:scale-95 transition rounded-md font-medium text-sm">
                ← Previous
            </button>
            
            <span id="counter" class="font-mono text-lg font-bold text-zinc-300">
                0 / 0
            </span>
            
            <button id="next-btn" class="px-5 py-2 bg-red-600 hover:bg-red-500 active:scale-95 transition rounded-md font-medium text-sm">
                Next →
            </button>
        </div>

        <!-- URL Lookup Tool -->
        <div class="w-full max-w-md flex flex-col gap-2 mt-2">
            <label for="url-lookup" class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">
                Jump to Video via URL:
            </label>
            <div class="flex gap-2">
                <input 
                    type="text" 
                    id="url-lookup" 
                    placeholder="Paste YouTube video URL here..." 
                    class="flex-1 bg-zinc-800 border border-zinc-700 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-red-500 text-zinc-200 placeholder-zinc-500"
                />
                <button id="lookup-btn" class="px-4 py-2 bg-zinc-700 hover:bg-zinc-600 rounded-md text-sm font-medium transition">
                    Go
                </button>
            </div>
            <p id="error-msg" class="text-xs text-red-400 hidden"></p>
        </div>

    </main>

    <!-- Footer Section -->
    <footer class="text-center text-xs text-zinc-600 my-6">
        Powered by open-source tech.
    </footer>
    <!-- App Logic Script -->
    <script>
        // 1. Paste your custom YouTube Video IDs and human-readable durations inside this array.
        const playlistData = [
            { id: "9JDTQ-tSMb0", duration: "5m 29s" },
            { id: "0XKoiO4b97Y", duration: "7m 11s" },
            { id: "9bZkp7q19f0", duration: "4m 13s" }
        ];

        // App state
        let currentIndex = 0;
        let totalPlaylistDuration = 0;

        // DOM elements
        const player = document.getElementById('youtube-player');
        const counter = document.getElementById('counter');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const urlInput = document.getElementById('url-lookup');
        const lookupBtn = document.getElementById('lookup-btn');
        const errorMsg = document.getElementById('error-msg');
        
        // UI metrics elements
        const progressBar = document.getElementById('progress-bar');
        const timeIndicator = document.getElementById('time-indicator');
        const percentIndicator = document.getElementById('percent-indicator');

        // Parse text duration into numeric seconds
        function parseToSeconds(timeStr) {
            let totalSecs = 0;
            const hoursMatch = timeStr.match(/(\d+)\s*h/i);
            const minsMatch = timeStr.match(/(\d+)\s*m/i);
            const secsMatch = timeStr.match(/(\d+)\s*s/i);

            if (hoursMatch) totalSecs += parseInt(hoursMatch[1]) * 3600;
            if (minsMatch)  totalSecs += parseInt(minsMatch[1]) * 60;
            if (secsMatch)  totalSecs += parseInt(secsMatch[1]);
            
            return totalSecs;
        }

        // Format raw seconds back into "Xh Ym Zs"
        function formatTime(totalSeconds) {
            const hrs = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            const displayMins = mins < 10 ? "0" + mins : mins;
            const displaySecs = secs < 10 ? "0" + secs : secs;
            return `${hrs}h ${displayMins}m ${displaySecs}s`;
        }

        function calculateTotalDuration() {
            totalPlaylistDuration = playlistData.reduce((sum, item) => sum + parseToSeconds(item.duration), 0);
        }

        function getWatchTimeProgress() {
            let currentProgressSeconds = 0;
            for (let i = 0; i <= currentIndex; i++) {
                currentProgressSeconds += parseToSeconds(playlistData[i].duration);
            }
            return currentProgressSeconds;
        }

        function updateUI() {
            if (playlistData.length === 0) return;
            const currentVideo = playlistData[currentIndex];
            player.src = `https://youtube.com{currentVideo.id}?rel=0`;
            counter.innerText = `${currentIndex + 1} / ${playlistData.length}`;

            const accumulatedWatchTime = getWatchTimeProgress();
            const progressPercent = totalPlaylistDuration > 0 ? Math.round((accumulatedWatchTime / totalPlaylistDuration) * 100) : 0;

            progressBar.style.width = `${progressPercent}%`;
            percentIndicator.innerText = `${progressPercent}% watched`;
            timeIndicator.innerText = `${formatTime(accumulatedWatchTime)} / ${formatTime(totalPlaylistDuration)}`;

            prevBtn.disabled = currentIndex === 0;
            prevBtn.classList.toggle('opacity-50', currentIndex === 0);
            prevBtn.classList.toggle('cursor-not-allowed', currentIndex === 0);

            nextBtn.disabled = currentIndex === playlistData.length - 1;
            nextBtn.classList.toggle('opacity-50', currentIndex === playlistData.length - 1);
            nextBtn.classList.toggle('cursor-not-allowed', currentIndex === playlistData.length - 1);
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; updateUI(); } });
        nextBtn.addEventListener('click', () => { if (currentIndex < playlistData.length - 1) { currentIndex++; updateUI(); } });

        function handleLookup() {
            errorMsg.classList.add('hidden');
            const urlValue = urlInput.value.trim();
            if (!urlValue) return;

            const extractedId = extractVideoId(urlValue);
            if (!extractedId) {
                errorMsg.innerText = "Invalid YouTube URL format.";
                errorMsg.classList.remove('hidden');
                return;
            }

            const foundIndex = playlistData.findIndex(item => item.id === extractedId);
            if (foundIndex !== -1) {
                currentIndex = foundIndex;
                updateUI();
                urlInput.value = "";
            } else {
                errorMsg.innerText = "This video is not part of this specific playlist challenge.";
                errorMsg.classList.remove('hidden');
            }
        }

        lookupBtn.addEventListener('click', handleLookup);
        urlInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLookup(); });

        if (playlistData.length > 0) {
            calculateTotalDuration();
            updateUI();
        }
    </script>
</body>
</html>
