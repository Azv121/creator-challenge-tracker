<!DOCTYPE html>
<html>
<body style="background:#111;color:white;font-family:sans-serif">

<input id="url" style="width:100%" placeholder="Torbox WebDAV URL">
<br><br>

<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<br><br>

<button onclick="loadVideo()">Load metadata</button>

<video id="v" controls style="width:600px;margin-top:20px"></video>

<pre id="out"></pre>

<script>
function loadVideo() {

    const url = document.getElementById("url").value;
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    const video = document.getElementById("v");

    // embed credentials directly (important for WebDAV)
    const authUrl = url.replace(
        "https://",
        `https://${user}:${pass}@`
    );

    video.src = authUrl;
    video.load();

    video.onloadedmetadata = () => {
        document.getElementById("out").textContent =
            "Duration: " + video.duration.toFixed(2) + " seconds";
    };

    video.onerror = () => {
        document.getElementById("out").textContent =
            "Failed to load video (auth / CORS / range issue)";
    };
}
</script>

</body>
</html>
